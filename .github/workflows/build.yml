# Builds Porpoise on GitHub: the payload SDK, RADV (the Vulkan driver) and the
# title, with the same sibling layout BUILDING.md describes. The packaged
# dist/Porpoise-PPSA99764.zip is kept as the run's "Porpoise-PPSA99764"
# artifact: open the run on the Actions tab and download it from there.
name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out Porpoise
        uses: actions/checkout@v4
        with:
          path: Porpoise

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the host tools
        run: |
          sudo apt-get update
          # The SDK and the cores: clang/lld/llvm 18. Mesa's OpenCL host tools
          # (mesa_clc, vtn_bindgen2): LLVM, Clang, libclc and the SPIR-V
          # translator of the same version.
          sudo apt-get install --yes \
            clang-18 lld-18 llvm-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev \
            libclc-18-dev libllvmspirvlib-18-dev llvm-spirv-18 libpolly-18-dev \
            cmake make ninja-build pkg-config rsync wget curl unzip zip tar git \
            bison flex glslang-tools python3-pil python3-pip libzstd-dev zlib1g-dev
          pip3 install --break-system-packages --user meson mako pyyaml packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # The build calls the unversioned names (clang, ld.lld, llvm-objdump...).
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Fetch the PS5 payload SDK, PS5_Vulkan and PS5_Mesa
        run: |
          # Each project pins its own revision and exports it with git archive,
          # so the full history of the forks is fetched.
          git clone https://github.com/mihawk-99/PS5_PayloadSDK PS5_PayloadSDK
          git clone --depth 1 https://github.com/mihawk-99/PS5_Vulkan PS5_Vulkan
          git clone https://github.com/mihawk-99/PS5_Mesa PS5_Mesa
          git -C PS5_PayloadSDK fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          git -C PS5_Mesa fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Restore built dependencies
        uses: actions/cache@v4
        with:
          path: |
            PS5_Vulkan/.deps/native
            Porpoise/.deps/native
          key: deps-${{ runner.os }}-${{ hashFiles('PS5_Vulkan/tools/build-radv.sh', 'PS5_Vulkan/tools/setup-native-dependencies.sh', 'Porpoise/tools/setup-native-dependencies.sh') }}

      - name: Build RADV (release)
        working-directory: PS5_Vulkan
        run: |
          chmod +x tools/*.sh
          bash tools/setup-native-dependencies.sh
          bash tools/build-radv.sh release || {
            for log in .deps/work/*.log; do echo "::group::$log"; tail -60 "$log"; echo "::endgroup::"; done
            exit 1
          }
          ls -lh .deps/native/radv-release/lib/

      - name: Build Porpoise
        working-directory: Porpoise
        run: |
          chmod +x tools/*.sh || true
          PS5_FORCE_CORES=1 make

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: Porpoise-PPSA99764
          path: Porpoise/dist/PPSA99764/
          if-no-files-found: error
